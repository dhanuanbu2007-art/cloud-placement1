<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Cloud Placement</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- LOGIN -->

            <div id="loginSection">

                <h1>Placement Portal</h1>

                <p class="subtitle">
                    Login to continue
                </p>

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                    >

                </div>

                <div class="form-group">

                    <label>Role</label>

                    <select id="loginRole">

                        <option value="student">
                            Student
                        </option>

                        <option value="company">
                            Company
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                    </select>

                </div>

                <button
                    class="btn"
                    id="loginBtn"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="message"
                ></p>

                <p class="switch-text">

                    Don't have an account?

                    <a id="showRegister">
                        Register

                    </a>

                </p>

            </div>


            <!-- REGISTER -->

            <div id="registerSection">

                <h1>Create Account</h1>

                <p class="subtitle">
                    Register as Student or Company
                </p>

                <div class="form-group">

                    <label>Full Name / Company Name</label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter name"
                    >

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter email"
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 6 characters"
                    >

                </div>

                <div class="form-group">

                    <label>Role</label>

                    <select id="registerRole">

                        <option value="student">
                            Student
                        </option>

                        <option value="company">
                            Company
                        </option>

                    </select>

                </div>

                <button
                    class="btn"
                    id="registerBtn"
                >
                    Create Account
                </button>

                <p
                    id="registerMessage"
                    class="message"
                ></p>

                <p class="switch-text">

                    Already have an account?

                    <a id="showLogin">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

    <script type="module" src="js/auth.js"></script>

</body>

</html>
