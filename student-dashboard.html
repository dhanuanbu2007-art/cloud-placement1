<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - Cloud Placement</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- HEADER -->

        <header class="dashboard-header">

            <h1>Student Dashboard</h1>

            <button
                class="logout-btn"
                id="logoutBtn">
                Logout
            </button>

        </header>


        <!-- MAIN CONTENT -->

        <main class="dashboard-content">

            <!-- WELCOME -->

            <div class="welcome">

                <h2>
                    Welcome,
                    <span id="studentName">Student</span> 👋
                </h2>

                <p>
                    Manage your profile and apply for placement opportunities.
                </p>

            </div>


            <!-- STATISTICS -->

            <div class="card-container">

                <div class="card">

                    <h3>Available Jobs</h3>

                    <p id="jobCount">0</p>

                </div>


                <div class="card">

                    <h3>My Applications</h3>

                    <p id="applicationCount">0</p>

                </div>


                <div class="card">

                    <h3>Placement Status</h3>

                    <p id="placementStatus">
                        Not Selected
                    </p>

                </div>

            </div>


            <!-- STUDENT PROFILE -->

            <div class="section">

                <h2>My Profile</h2>

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="profileName"
                        placeholder="Enter your name">
                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="profileEmail"
                        disabled>

                </div>


                <div class="form-group">

                    <label>Student ID</label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Example: PEC2026001">

                </div>


                <div class="form-group">

                    <label>Department</label>

                    <select id="department">

                        <option value="">
                            Select Department
                        </option>

                        <option value="CSE">
                            Computer Science and Engineering
                        </option>

                        <option value="IT">
                            Information Technology
                        </option>

                        <option value="ECE">
                            Electronics and Communication Engineering
                        </option>

                        <option value="EEE">
                            Electrical and Electronics Engineering
                        </option>

                        <option value="MECH">
                            Mechanical Engineering
                        </option>

                        <option value="CIVIL">
                            Civil Engineering
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Year</label>

                    <select id="year">

                        <option value="">
                            Select Year
                        </option>

                        <option value="1">
                            1st Year
                        </option>

                        <option value="2">
                            2nd Year
                        </option>

                        <option value="3">
                            3rd Year
                        </option>

                        <option value="4">
                            4th Year
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>CGPA</label>

                    <input
                        type="number"
                        id="cgpa"
                        step="0.01"
                        min="0"
                        max="10"
                        placeholder="Example: 8.25">

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number">

                </div>


                <div class="form-group">

                    <label>Skills</label>

                    <textarea
                        id="skills"
                        placeholder="Example: Python, Java, HTML, CSS, Machine Learning">
                    </textarea>

                </div>


                <button
                    class="btn"
                    id="saveProfileBtn">

                    Save Profile

                </button>


                <p
                    id="profileMessage"
                    class="message">
                </p>

            </div>


            <!-- AVAILABLE JOBS -->

            <div class="section">

                <h2>Available Placement Drives</h2>

                <div id="jobsContainer">

                    <p>
                        Loading jobs...
                    </p>

                </div>

            </div>


            <!-- APPLICATIONS -->

            <div class="section">

                <h2>My Applications</h2>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>Job</th>

                                <th>Company</th>

                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody id="applicationsTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <script
        type="module"
        src="js/student.js">
    </script>

</body>

</html>
