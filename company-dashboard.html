<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="dashboard">

        <header class="dashboard-header">

            <h1>Company Dashboard</h1>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Logout
            </button>

        </header>


        <main class="dashboard-content">

            <div class="welcome">

                <h2>
                    Welcome, <span id="companyName">Company</span>
                </h2>

                <p>
                    Manage your placement opportunities.
                </p>

            </div>


            <div class="card-container">

                <div class="card">

                    <h3>Jobs Posted</h3>

                    <p id="jobCount">
                        0
                    </p>

                </div>

                <div class="card">

                    <h3>Applications</h3>

                    <p id="applicationCount">
                        0
                    </p>

                </div>

            </div>


            <div class="section">

                <h2>Post New Job</h2>

                <div class="form-group">

                    <label>Job Title</label>

                    <input
                        type="text"
                        id="jobTitle"
                        placeholder="Example: Software Developer"
                    >

                </div>


                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        id="jobDescription"
                        placeholder="Enter job description"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>Salary</label>

                    <input
                        type="text"
                        id="salary"
                        placeholder="Example: ₹6 LPA"
                    >

                </div>


                <div class="form-group">

                    <label>Minimum CGPA</label>

                    <input
                        type="number"
                        id="minimumCGPA"
                        step="0.1"
                        placeholder="Example: 7.0"
                    >

                </div>


                <button
                    class="btn"
                    id="postJobBtn"
                >
                    Post Job
                </button>

                <p
                    class="message"
                    id="jobMessage"
                ></p>

            </div>


            <div class="section">

                <h2>My Job Posts</h2>

                <div id="myJobs">

                    <p>Loading...</p>

                </div>

            </div>


            <div class="section">

                <h2>Student Applications</h2>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>Student</th>
                                <th>Job</th>
                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody id="applicationsTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <script type="module" src="js/company.js"></script>

</body>

</html>
